name: C3-4 first attention QKV attribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c3-qkv:
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-replay.txt
      - name: Restore immutable frozen input
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Compare Q K V projections and first attention output
        run: python scripts/c3_first_attention_qkv.py replay_inputs/frozen_inputs c3_qkv_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-first-attention-qkv
          path: c3_qkv_evidence/
          if-no-files-found: error
