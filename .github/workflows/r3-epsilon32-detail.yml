name: R3 epsilon32 mismatch detail
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned packages
        run: python -m pip install -r requirements-replay.txt
      - name: Restore frozen inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Inspect epsilon 32 mismatch cases
        run: python scripts/r3_epsilon32_mismatch_detail.py replay_inputs/frozen_inputs r3_detail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-epsilon32-mismatch-detail
          path: r3_detail/
          if-no-files-found: warn
