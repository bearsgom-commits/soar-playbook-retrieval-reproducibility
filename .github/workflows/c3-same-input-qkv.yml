name: C3-5 same input QKV operator isolation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qkv-operator:
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-replay.txt
      - name: Restore frozen inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Test identical CPU input and QKV weights using CPU and MPS linear operators
        run: python scripts/c3_same_input_qkv_operator.py replay_inputs/frozen_inputs c3_same_input_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-same-input-qkv-operator
          path: c3_same_input_evidence/
          if-no-files-found: error
