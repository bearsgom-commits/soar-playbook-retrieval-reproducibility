name: R1 E5 input and weight fingerprint diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r1-model-fingerprint:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned replay environment
        run: |
          python -m pip install -r requirements-replay.txt
      - name: Recover verified frozen inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: R1 fingerprint without scientific rerun
        run: |
          python scripts/r1_e5_fingerprint.py replay_inputs/frozen_inputs r1_evidence
      - name: Upload independent diagnostic fingerprint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-e5-fingerprint
          path: r1_evidence/
          if-no-files-found: warn
