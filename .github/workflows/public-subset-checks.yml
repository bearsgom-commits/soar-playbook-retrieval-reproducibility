name: Public subset checks

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/verify_public_aggregates.py"
      - "scripts/verify_frozen_ranking_replay.py"
      - "scripts/render_public_aggregate_figures.py"
      - "results/**"
      - "requirements-public.txt"
      - ".github/workflows/public-subset-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curated-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public unit-test subset dependencies
        run: python -m pip install -r requirements-public.txt
      - name: Verify frozen aggregate consistency
        run: python scripts/verify_public_aggregates.py
      - name: Replay frozen ranking summaries
        run: python scripts/verify_frozen_ranking_replay.py
      - name: Run available research unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_electronics_bm25_fixed.py \
            tests/test_electronics_human_gt_scoring.py \
            tests/test_public_guard_repr.py
      - name: Render publication-support plots
        run: python scripts/render_public_aggregate_figures.py
      - name: Archive generated public SVGs
        uses: actions/upload-artifact@v4
        with:
          name: public-aggregate-plots
          path: generated_figures/*.svg
          if-no-files-found: error
