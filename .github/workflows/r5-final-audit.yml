name: R5 final R4 evidence audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable R4 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p r5_r4_evidence
          gh run download 40480603149 -R ${{ github.repository }} -n r4-full-cpu-replay-2520 -D r5_r4_evidence
      - name: Audit all 2520 condition keys and mismatches
        run: |
          python scripts/r5_audit_r4_evidence.py --r4 r5_r4_evidence --out r5_report
      - name: Upload final evidence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-final-audit
          path: r5_report/
          if-no-files-found: warn
