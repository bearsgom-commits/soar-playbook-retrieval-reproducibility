name: Model-pinned E5 Guard reproduction (author-approved input ZIP)

on:
  push:
    branches: [main]
    paths:
      - "input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-input-replay:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout public research artifact
        uses: actions/checkout@v4
      - name: Verify input ZIP exists
        run: |
          test -f input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip || {
            echo "BLOCKED: original input archive not yet uploaded into input_packages/"
            exit 1
          }
      - name: Install Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install frozen E5 replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-replay.txt
      - name: Unpack unmodified original inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Verify original four input files
        run: |
          python scripts/verify_recovered_inputs.py replay_inputs/frozen_inputs
          python scripts/rerun_e5_guard_from_frozen_inputs.py --inputs replay_inputs/frozen_inputs --verify-inputs
      - name: Fresh scientific encoder and Guard replay (Apple MPS)
        run: |
          python scripts/rerun_e5_guard_from_frozen_inputs.py \
            --inputs replay_inputs/frozen_inputs \
            --device mps \
            --batch-size 4 \
            --out fresh_replay_results
      - name: Publish rerun comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-replay-comparison-mps
          path: fresh_replay_results/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce exact Guard ranking comparison on source-compatible backend
        run: |
          python - <<'PY'
          import json
          with open("fresh_replay_results/comparison_report.json", encoding="utf-8") as f:
              report = json.load(f)
          print(json.dumps(report["track_result"], indent=2))
          assert report["source_compatible_backend"] is True
          assert report["all_exact_guard_top10"], "Fresh MPS retrieval did not exactly reproduce frozen Top-10 order: inspect archived report; no scientific inputs modified"
          PY
