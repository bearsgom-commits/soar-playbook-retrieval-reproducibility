name: C3-8 corrected MPS frozen ranking smoke gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 105
    env:
      VECLIB_MAXIMUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-replay.txt
      - name: Restore immutable frozen inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Run Q03 Q12 Q29 B0 anchor CPU corrected-MPS source ranking smoke test
        run: python scripts/c3_8_rank_smoke.py replay_inputs/frozen_inputs c3_8_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-8-rank-smoke-evidence
          path: c3_8_evidence/
          if-no-files-found: error
