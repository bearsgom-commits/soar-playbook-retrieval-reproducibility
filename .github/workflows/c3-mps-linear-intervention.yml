name: C3-6 MPS linear operator corrective intervention
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operator-intervention:
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-replay.txt
      - name: Restore frozen inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Test CPU double reference and three MPS linear execution paths
        run: python scripts/c3_mps_linear_intervention.py replay_inputs/frozen_inputs c3_linear_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-mps-linear-intervention
          path: c3_linear_evidence/
          if-no-files-found: error
