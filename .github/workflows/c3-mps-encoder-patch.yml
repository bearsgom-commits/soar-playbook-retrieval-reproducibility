name: C3-7 MPS E5 linear correction trial
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c3-encoder-patch:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-replay.txt
      - name: Restore immutable inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Test default versus QKV-only and full-linear GEMV encoder correction
        run: python scripts/c3_mps_encoder_patch_trial.py replay_inputs/frozen_inputs c3_encoder_patch_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-mps-encoder-patch-trial
          path: c3_encoder_patch_evidence/
          if-no-files-found: error
