name: R3-H controlled CPU numerical diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r3h-control:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned environment
        run: python -m pip install -r requirements-replay.txt
      - name: Recover hash-verified frozen inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Repeat default CPU process twice
        run: |
          python scripts/r3h_cpu_control.py replay_inputs/frozen_inputs r3h_evidence default 1
          python scripts/r3h_cpu_control.py replay_inputs/frozen_inputs r3h_evidence default 2
      - name: Repeat single-thread CPU process twice
        env:
          VECLIB_MAXIMUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python scripts/r3h_cpu_control.py replay_inputs/frozen_inputs r3h_evidence controlled 1
          python scripts/r3h_cpu_control.py replay_inputs/frozen_inputs r3h_evidence controlled 2
      - name: Audit stage-by-stage numerical divergence
        run: python scripts/r3h_cpu_control_aggregate.py r3h_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3h-cpu-numerical-diagnosis
          path: r3h_evidence/
          if-no-files-found: warn
