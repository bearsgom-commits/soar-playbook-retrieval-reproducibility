name: R4 full independent CPU replay 2520
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-cpu-replay:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      VECLIB_MAXIMUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned replay packages
        run: python -m pip install -r requirements-replay.txt
      - name: Restore immutable frozen inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Verify all frozen input hashes
        run: python scripts/rerun_e5_guard_from_frozen_inputs.py --inputs replay_inputs/frozen_inputs --verify-inputs
      - name: Reproduce four-track 2520 condition rankings on CPU
        run: |
          python scripts/rerun_e5_guard_from_frozen_inputs.py \
            --inputs replay_inputs/frozen_inputs \
            --device cpu --batch-size 16 --out r4_cpu_replay
      - name: Summarize strict rank equality without changing the reference
        if: always()
        run: |
          if test -f r4_cpu_replay/comparison_report.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path("r4_cpu_replay/comparison_report.json")
          d=json.loads(p.read_text())
          print("R4_DEVICE=",d["device"])
          print("R4_TOTAL_COMPARISONS=",sum(x["comparisons"] for x in d["track_result"].values()))
          print("R4_TOP10_EXACT=",sum(x["top10_exact"] for x in d["track_result"].values()))
          print("R4_TOP1_EXACT=",sum(x["top1_exact"] for x in d["track_result"].values()))
          for k,v in d["track_result"].items():
            print("R4_TRACK=",k,"TOP10=",v["top10_exact"],"/",v["comparisons"],"TOP1=",v["top1_exact"],"MAX_SCORE_DELTA=",v["max_abs_common_score_difference"])
          print("R4_STRICT_TOP10_PASS=",d["all_exact_guard_top10"])
          print("R4_CPU_IS_NOT_SOURCE_COMPATIBLE_MPS=YES")
          PY
          fi
      - name: Upload full replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-full-cpu-replay-2520
          path: r4_cpu_replay/
          if-no-files-found: warn
