name: Frozen E5 model access and encoding preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e5-model-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-model-smoke:
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install frozen model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-replay.txt
      - name: Load exact E5 revision and encode non-study fixtures
        run: |
          python - <<'PY'
          import numpy as np
          import torch
          from sentence_transformers import SentenceTransformer
          model_id="intfloat/multilingual-e5-base"
          revision="d128750597153bb5987e10b1c3493a34e5a4502a"
          assert torch.backends.mps.is_available(), "SOURCE_MPS_UNAVAILABLE"
          m=SentenceTransformer(model_id, revision=revision, device="mps")
          observed=getattr(m[0].auto_model.config, "_commit_hash", None)
          print("OBSERVED_MODEL_REVISION=", observed)
          assert str(observed)==revision, "PINNED_MODEL_REVISION_MISMATCH"
          print("MODEL_MAX_SEQ_LENGTH=", m.max_seq_length)
          assert m.max_seq_length == 512, "MODEL_MAX_SEQ_LENGTH_MISMATCH"
          x=m.encode(
            ["query: security alert", "passage: response playbook"],
            batch_size=2,
            convert_to_numpy=True,
            normalize_embeddings=True,
            prompt="",
            show_progress_bar=False,
          )
          assert x.shape==(2,768) and x.dtype==np.float32
          assert np.isfinite(x).all()
          print("PASS: pinned E5 model loads and performs MPS encoding")
          print("NOTE: NOT the 30-query / 1606-playbook scientific experiment")
          PY
