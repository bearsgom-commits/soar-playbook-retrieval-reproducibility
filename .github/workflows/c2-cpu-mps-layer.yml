name: C2 targeted CPU MPS layer attribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c2:
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-replay.txt
      - name: Restore original verified inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Compare CPU MPS output for each E5 transformer layer
        run: python scripts/c2_cpu_mps_layer_attribution.py replay_inputs/frozen_inputs c2_evidence
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-e5-cpu-mps-layer-attribution
          path: c2_evidence/
          if-no-files-found: error
