name: R3-J frozen CPU math path fingerprint
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  math-path:
    runs-on: macos-latest
    timeout-minutes: 65
    env:
      VECLIB_MAXIMUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-replay.txt
      - name: Restore frozen verified inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Run R3-J intermediate fingerprints
        run: python scripts/r3j_cpu_math_path.py replay_inputs/frozen_inputs r3j_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3j-math-path
          path: r3j_evidence/
          if-no-files-found: warn
