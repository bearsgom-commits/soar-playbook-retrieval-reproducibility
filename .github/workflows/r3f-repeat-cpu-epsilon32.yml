name: R3-F repeat CPU epsilon32 diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-repeat:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned environment
        run: python -m pip install -r requirements-replay.txt
      - name: Recover frozen inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Repeat CPU encoding and epsilon32 ranking three times
        run: python scripts/r3f_repeat_cpu_epsilon32.py replay_inputs/frozen_inputs r3f_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3f-repeat-cpu-epsilon32
          path: r3f_evidence/
          if-no-files-found: warn
