name: R3 CPU B0 anchor controlled replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r3-cpu-anchor:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned replay packages
        run: python -m pip install -r requirements-replay.txt
      - name: Recover verified frozen inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: R3 CPU anchor replay
        run: python scripts/r3_cpu_b0_anchor.py replay_inputs/frozen_inputs r3_evidence
      - name: Upload R3 comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-cpu-anchor
          path: r3_evidence/
          if-no-files-found: warn
