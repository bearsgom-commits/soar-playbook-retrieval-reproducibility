name: R3-E repeated CPU numerical variability
on:
  push:
    paths:
      - '.github/workflows/r3-epsilon32-variability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  variability:
    runs-on: macos-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned replay packages
        run: python -m pip install -r requirements-replay.txt
      - name: Recover frozen inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Run three independent CPU replays
        run: |
          for i in 1 2 3; do
            python scripts/r3_epsilon32_variability.py replay_inputs/frozen_inputs r3_evidence "$i"
          done
          python scripts/r3_epsilon32_variability_aggregate.py r3_evidence
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-epsilon32-variability
          path: r3_evidence/
          if-no-files-found: warn
