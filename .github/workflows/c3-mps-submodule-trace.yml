name: C3-3 MPS submodule divergence localization
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c3-trace:
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-replay.txt
      - name: Restore immutable inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Trace E5 submodules on CPU and MPS
        run: python scripts/c3_mps_submodule_trace.py replay_inputs/frozen_inputs c3_trace_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-mps-submodule-trace
          path: c3_trace_evidence/
          if-no-files-found: error
