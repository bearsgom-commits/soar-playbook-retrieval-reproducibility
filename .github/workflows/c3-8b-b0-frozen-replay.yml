name: C3-8B corrected MPS B0 full 630-condition frozen reproducibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b0-complete:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      VECLIB_MAXIMUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-replay.txt
      - name: Restore immutable frozen inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Replicate all 630 B0 rank conditions with corrected MPS
        run: python scripts/c3_8b_b0_frozen_replay.py replay_inputs/frozen_inputs c3_8b_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-8b-b0-630-condition-replication
          path: c3_8b_evidence/
          if-no-files-found: error
