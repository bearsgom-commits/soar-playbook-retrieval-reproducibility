name: C3-8C corrected MPS remaining 1890 frozen rank conditions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remaining-tracks:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      VECLIB_MAXIMUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-replay.txt
      - name: Restore and verify frozen inputs
        run: |
          mkdir -p replay_inputs
          unzip -q input_packages/SOAR_FROZEN_INPUTS_AUTHOR_APPROVED_20261025.zip 'frozen_inputs/*' -d replay_inputs
      - name: Run three remaining tracks reusing one corrected C-broad encoding
        run: python scripts/c3_8c_remaining_tracks.py replay_inputs/frozen_inputs c3_8c_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3-8c-three-tracks-1890-evidence
          path: c3_8c_evidence/
          if-no-files-found: error
